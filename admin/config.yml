backend:
  name: git-gateway
  branch: main
 
media_folder: "images"
public_folder: "/images"
 
collections:
  - name: "settings"
    label: "Site Settings"
    files:
      - label: "Contact & Social Links"
        name: "settings"
        file: "content/settings.json"
        fields:
          - {label: "WhatsApp Number (as displayed on the site)", name: "whatsappDisplay", widget: "string"}
          - {label: "WhatsApp Link (full wa.me URL, digits only, no + or spaces)", name: "whatsappLink", widget: "string"}
          - {label: "Email Address", name: "email", widget: "string"}
          - {label: "Instagram Profile URL", name: "instagramUrl", widget: "string"}
          - {label: "Instagram Handle (as displayed on the site)", name: "instagramHandle", widget: "string"}
 
  - name: "homepage"
    label: "Homepage"
    files:
      - label: "Hero Section"
        name: "homepage"
        file: "content/homepage.json"
        fields:
          - {label: "Hero Headline (press Enter for a line break)", name: "heroHeadline", widget: "text"}
          - {label: "Hero Tagline", name: "heroTagline", widget: "string"}
 
  - name: "training200"
    label: "200-Hour Training"
    files:
      - label: "Dates & Price"
        name: "training-200hr"
        file: "content/training-200hr.json"
        fields:
          - {label: "Regular Price", name: "price", widget: "string"}
          - {label: "Early Bird Price", name: "earlyBirdPrice", widget: "string"}
          - {label: "Costa Rica Dates (e.g. 10th – 17th January 2027)", name: "costaRicaDate", widget: "string"}
          - {label: "Tuscany Dates", name: "tuscanyDate", widget: "string"}
 
  - name: "trainingYin"
    label: "Yin Yoga Training"
    files:
      - label: "Dates & Prices"
        name: "training-yin"
        file: "content/training-yin.json"
        fields:
          - label: "Costa Rica"
            name: "costaRica"
            widget: "object"
            fields:
              - {label: "Dates (one per line)", name: "dates", widget: "list"}
              - {label: "Price", name: "price", widget: "string"}
              - {label: "Early Bird Price", name: "earlyBird", widget: "string"}
          - label: "Italy"
            name: "italy"
            widget: "object"
            fields:
              - {label: "Dates (one per line)", name: "dates", widget: "list"}
              - {label: "Price", name: "price", widget: "string"}
              - {label: "Early Bird Price", name: "earlyBird", widget: "string"}
 
  - name: "retreats"
    label: "Retreats"
    folder: "content/retreats"
    extension: "json"
    format: "json"
    create: true
    slug: "{{fields.slug}}"
    summary: "{{title}} — {{location}}"
    fields:
      - {label: "Retreat Name", name: "title", widget: "string"}
      - {label: "Slug (short web-safe id, e.g. sacred-pause — no spaces, lowercase, used in the page link)", name: "slug", widget: "string", hint: "Only letters, numbers, and hyphens."}
      - {label: "Location", name: "location", widget: "string"}
      - label: "Status"
        name: "status"
        widget: "select"
        options: [{label: "Upcoming (has a date)", value: "upcoming"}, {label: "Coming soon (no date yet)", value: "coming-soon"}]
        default: "coming-soon"
      - {label: "Date Range (only shown when Status is Upcoming, e.g. 8th – 11th July 2027)", name: "dateRange", widget: "string", required: false}
      - {label: "Photo", name: "image", widget: "image"}
      - {label: "Card Teaser (short line shown on the retreat card in the list)", name: "cardBlurb", widget: "string"}
      - label: "Add a full detail section for this retreat?"
        name: "hasDetail"
        widget: "boolean"
        default: false
        hint: "Turn this on to show a full description section further down the page, with its own paragraphs and an optional list of what's included."
      - {label: "Detail Section Label (defaults to Retreat Name if left blank)", name: "eyebrow", widget: "string", required: false}
      - {label: "Tagline (one short sentence under the title)", name: "tagline", widget: "string", required: false}
      - {label: "Description (add one item per paragraph)", name: "body", widget: "list", required: false}
      - {label: "What's Included (add one item per line)", name: "offerings", widget: "list", required: false}
      - {label: "Order (lower numbers appear first in the list)", name: "order", widget: "number", default: 10}
 
  - name: "images"
    label: "Photos"
    files:
      - label: "Site Photos"
        name: "images"
        file: "content/images.json"
        fields:
          - {label: "Logo (appears in every header & footer)", name: "logo", widget: "image"}
          - {label: "Homepage Hero Video Poster (shown before video plays)", name: "heroPoster", widget: "image"}
          - {label: "\"Our Approach\" Photo (Homepage)", name: "approachPhoto", widget: "image"}
          - {label: "\"Take the First Step\" Photo (Homepage)", name: "ctaPhoto", widget: "image"}
          - {label: "Team Photo — Daniela", name: "teamDaniela", widget: "image"}
          - {label: "Team Photo — Dani", name: "teamDani", widget: "image"}
          - {label: "200-Hour Hybrid Approach Photo", name: "hybridPhoto", widget: "image"}
          - {label: "Yin Yoga Training Photo", name: "yinPhoto", widget: "image"}
